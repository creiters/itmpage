<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="manifest.json">
  <title>42 Intra Personal Hub</title>
  <style>
    :root {
      --bg: #0e1117;
      --card: #161b22;
      --border: #30363d;
      --accent: #00babc;
      --accent-dim: rgba(0, 186, 188, 0.15);
      --text: #c9d1d9;
      --text-white: #ffffff;
      --green: #2ea043;
      --red: #da3633;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 1.5rem; max-width: 1080px; margin: auto; }
    header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 1rem; margin-bottom: 1.5rem; }
    h1 { color: var(--accent); font-size: 1.4rem; }
    
    .panel { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 1.25rem; margin-bottom: 1.5rem; }
    .input-row { display: flex; gap: 0.75rem; flex-wrap: wrap; margin-top: 0.75rem; }
    input { background: #0d1117; border: 1px solid var(--border); color: #fff; padding: 0.6rem 0.8rem; border-radius: 6px; flex: 1; min-width: 260px; }
    button { background: var(--accent); color: #000; border: none; font-weight: bold; border-radius: 6px; padding: 0.6rem 1.2rem; cursor: pointer; }
    button.logout { background: #21262d; color: var(--red); border: 1px solid var(--border); }
    
    .hidden { display: none !important; }
    .profile-card { display: flex; gap: 1.5rem; align-items: center; }
    .avatar { width: 84px; height: 84px; border-radius: 50%; border: 2px solid var(--accent); object-fit: cover; }
    .badge-bar { display: flex; gap: 0.5rem; margin-top: 0.5rem; flex-wrap: wrap; }
    .badge { background: var(--accent-dim); color: var(--accent); font-size: 0.75rem; padding: 0.2rem 0.5rem; border-radius: 4px; border: 1px solid var(--accent); }
    
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.5rem; }
    .stat-list { list-style: none; margin-top: 0.5rem; max-height: 280px; overflow-y: auto; }
    .stat-item { display: flex; justify-content: space-between; padding: 0.55rem 0; border-bottom: 1px solid #21262d; font-size: 0.88rem; }
    .status-ok { color: var(--green); font-weight: 600; }
    .status-fail { color: var(--red); font-weight: 600; }
    .status-progress { color: #f0883e; }
  </style>
</head>
<body>

  <header>
    <h1>42 Personal Intra Dashboard</h1>
    <div id="auth-actions">
      <button id="btn-logout" class="logout hidden">Disconnect</button>
    </div>
  </header>

  <!-- Setup Section: Configure OAuth App UID -->
  <div id="setup-view" class="panel">
    <h3>1. Connect with 42 Intra</h3>
    <p style="font-size: 0.85rem; color: #8b949e; margin-top: 0.25rem;">
      Register a regular application on <strong>profile.intra.42.fr/oauth/applications</strong>. 
      Set Redirect URI to this URL: <code id="display-uri" style="color:var(--accent);"></code>
    </p>
    <div class="input-row">
      <input type="text" id="client-id-input" placeholder="Application UID (Client ID)">
      <button id="btn-login">Authorize with Intra</button>
    </div>
  </div>

  <!-- Dashboard Section: Display User Information -->
  <div id="dashboard-view" class="hidden">
    <div class="panel profile-card">
      <img id="u-avatar" class="avatar" src="" alt="Avatar">
      <div>
        <h2 id="u-name" style="color: var(--text-white);"></h2>
        <div id="u-login" style="color: #8b949e; font-size: 0.9rem;"></div>
        <div class="badge-bar" id="u-badges"></div>
      </div>
    </div>

    <div class="grid">
      <!-- Projects Panel -->
      <div class="panel">
        <h3>My Projects</h3>
        <ul class="stat-list" id="project-list"></ul>
      </div>

      <!-- Campus Logtime / Presence Panel -->
      <div class="panel">
        <h3>Recent Workstation Check-ins</h3>
        <ul class="stat-list" id="location-list"></ul>
      </div>
    </div>
  </div>

  <script src="auth.js"></script>
  <script src="42.js"></script>
  <script src="app.js"></script>
</body>
</html>
