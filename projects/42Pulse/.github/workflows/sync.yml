name: Sync 42 Prague Cluster Data

on:
  schedule:
    - cron: '*/10 * * * *' # Runs every 10 minutes
  workflow_dispatch:        # Allows manual trigger from GitHub UI

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch 42 API Data (Native Node.js)
        env:
          INTRA_UID: ${{ secrets.INTRA_UID }}
          INTRA_SECRET: ${{ secrets.INTRA_SECRET }}
        run: node scripts/sync.js

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/peers.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update Prague cluster peers [skip ci]" && git push)
