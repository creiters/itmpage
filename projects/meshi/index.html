<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meshi // Offline WebRTC DataChannel Mesh</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/meshi.css">
</head>
<body>
  <header role="banner">
    <h1>PROJECT MESHI // METHOD 02</h1>
    <span id="node-status" class="badge" aria-live="polite">LINK: DISCONNECTED</span>
  </header>

  <main role="main" class="hud-container">
    <!-- Air-gapped Signaling Bridge -->
    <section class="card" aria-labelledby="signal-head">
      <h2 id="signal-head">Subnet Signaler (Air-Gapped Exchange)</h2>
      <textarea id="signal-token" placeholder="Paste or copy base64 handshake tokens..." aria-label="Signaling Token Box"></textarea>
      <div class="control-row">
        <button id="btn-create-offer" class="btn">1. Create Offer</button>
        <button id="btn-create-answer" class="btn">2. Accept & Answer</button>
        <button id="btn-finalize" class="btn">3. Finalize Handshake</button>
      </div>
    </section>

    <!-- Duplex Transmission Console -->
    <section class="card" aria-labelledby="channel-head">
      <h2 id="channel-head">P2P Socket Transceiver</h2>
      <div class="input-row">
        <input type="text" id="payload-input" placeholder="Type JSON/Text payload..." aria-label="Payload Text">
        <button id="btn-broadcast" class="btn btn-primary">Dispatch</button>
      </div>
      <div id="mesh-logs" class="terminal" role="log" aria-live="polite" aria-atomic="false"></div>
    </section>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
