<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Meshi // Play & Share</title>
  <link rel="stylesheet" href="./css/meshi-friendly.css">
</head>
<body>

  <main class="app-card">
    
    <!-- PLAYFUL AVATAR & RADAR -->
    <header class="hero-header">
      <div class="radar-bubble" id="radar-ring">
        <div class="device-avatar" id="avatar-icon">🍐</div>
      </div>
      <h1 class="fun-title">Project Meshi</h1>
      <div class="status-pill status-searching" id="status-tag">
        <span class="dot"></span>
        <span id="status-text">Looking for nearby friends...</span>
      </div>
    </header>

    <!-- BIG ACTION BUTTONS -->
    <section class="action-grid">
      
      <!-- CARD 1: CONNECT -->
      <button class="fun-card card-cyan" id="btn-magic-connect">
        <span class="card-emoji">🪄</span>
        <span class="card-name">Magic Connect</span>
        <span class="card-hint">Tap here to join friend's hotspot</span>
      </button>

      <!-- CARD 2: SEND A TOY OR PICTURE -->
      <label class="fun-card card-gold" for="simple-file-picker">
        <input type="file" id="simple-file-picker" style="display:none;">
        <span class="card-emoji">🎁</span>
        <span class="card-name">Send a Gift</span>
        <span class="card-hint">Share a photo, drawing or sound</span>
      </label>

    </section>

    <!-- BIG PROGRESS BAR -->
    <div class="transfer-box" id="transfer-container">
      <div class="box-labels">
        <span id="transfer-label">Sending gift...</span>
        <span id="transfer-percent">0%</span>
      </div>
      <div class="big-progress-rail">
        <div class="big-progress-fill" id="progress-bar-fill"></div>
      </div>
    </div>

    <!-- INBOX: WHERE RECEIVED ITEMS SHOW UP -->
    <section class="gifts-section">
      <div class="gifts-title">Received Gifts 🎈</div>
      <div class="gifts-shelf" id="gifts-inbox">
        <div class="gift-empty" id="empty-gift-note">No gifts yet! Bring another phone close to you.</div>
      </div>
    </section>

  </main>

  <script type="module" src="./js/meshi-friendly.js"></script>
</body>
</html>
