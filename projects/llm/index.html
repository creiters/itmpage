<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shared Offline LLM</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="layout">
    <aside id="sidebar">
      <h2>Model Engine</h2>
      <div>
        <label style="font-size: 0.8rem; color: var(--text-muted); display: block; margin-bottom: 6px;">Hugging Face Repository</label>
        <select id="select-model" style="width: 100%; margin-bottom: 8px;">
          <option value="smollm2-360m">SmolLM2-360M (~245 Chunks, 1MB ea)</option>
          <option value="llama-3.2-1b">Llama-3.2-1B (~780 Chunks, 1MB ea)</option>
          <option value="qwen2.5-1.5b">Qwen2.5-1.5B (~980 Chunks, 1MB ea)</option>
          <option value="smollm2-1.7b">SmolLM2-1.7B (~1060 Chunks, 1MB ea)</option>
          <option value="phi-3.5-mini">Phi-3.5-Mini (~2390 Chunks, 1MB ea)</option>
        </select>
        <button id="btn-download-split" style="width: 100%;">Fetch & Slice (1MB)</button>
      </div>

      <div id="progress-container" style="display: none;">
        <div class="progress-track">
          <div id="progress-fill" class="progress-fill"></div>
        </div>
        <span id="progress-text" style="font-size: 0.7rem; color: var(--text-muted); margin-top: 4px; display: block;">0%</span>
      </div>

      <hr style="border:0; border-top: 1px solid var(--border);">

      <h3>DAG Context & Slices</h3>
      <div id="graph-manifest" class="graph-box">No 1MB slices found in IndexedDB.</div>
      <button id="btn-export-slice" style="width: 100%; background: var(--bg-input); border: 1px solid var(--border);">Download Slice Envelope</button>

      <hr style="border:0; border-top: 1px solid var(--border);">

      <h3>WebRTC Mesh PIN Cluster</h3>
      <div>
        <button id="btn-host-pin" style="width: 100%; margin-bottom: 8px;">Create Host PIN</button>
        <textarea id="host-token-out" class="pin-box" placeholder="Host SDP token..." readonly></textarea>
      </div>

      <div>
        <textarea id="join-token-in" class="pin-box" placeholder="Paste peer signal here..."></textarea>
        <button id="btn-connect-pin" style="width: 100%; margin-top: 8px;">Connect via Token</button>
      </div>

      <div style="margin-top: auto;">
        <span class="badge" id="peer-status">0 Peers Connected</span>
      </div>
    </aside>

    <main id="chat-panel">
      <header>
        <div>
          <h1 style="font-size: 1.2rem;">Shared LLM Workspace</h1>
          <span id="node-label" style="font-size: 0.75rem; color: var(--text-muted);">Node: Initializing...</span>
        </div>
        <div>
          <span class="badge" id="engine-status">Engine: WASM Unloaded</span>
        </div>
      </header>

      <section id="chat-stream"></section>

      <footer>
        <input type="text" id="input-prompt" placeholder="Message offline LLM...">
        <button id="btn-send">Send</button>
      </footer>
    </main>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
