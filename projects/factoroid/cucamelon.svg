<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 550" width="100%" height="100%">
  <defs>
    <!-- Cyan Glow Filter -->
    <filter id="cyan-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Text Glow Filter -->
    <filter id="text-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Neon Text Gradient -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1AFFFF" />
      <stop offset="60%" stop-color="#00FFCC" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>
  </defs>

  <style>
    .pixel { shape-rendering: crispEdges; }
    .cuca-mid { fill: #79d98e; } /* SSHAnet --melon-mid */
    .cuca-light { fill: #aff5b4; } /* SSHAnet --melon-light */
    .cuca-dark { fill: #156B2E; }
    .cuca-bright { fill: #D7FF3B; }
    .cuca-cyan { fill: #1AFFFF; }
    .stem { fill: #8B5A2B; }

    /* Keyframes for outer pixels flying in (0->100) and out (100->0) infinitely */
    @keyframes assembleDisassembleLoop {
      0% {
        opacity: 0;
        transform: translate(var(--fly-x, -180px), var(--fly-y, -180px)) scale(2);
      }
      35%, 65% {
        opacity: 1;
        transform: translate(0, 0) scale(1);
      }
      100% {
        opacity: 0;
        transform: translate(var(--fly-x, -180px), var(--fly-y, -180px)) scale(2);
      }
    }

    /* Target ONLY outer flying pixels */
    .fly-pixel {
      animation: assembleDisassembleLoop 6s cubic-bezier(0.25, 1, 0.5, 1) infinite;
      animation-delay: var(--delay, 0s);
      transform-origin: center;
    }
  </style>

  <g transform="translate(10, 10)">
    <!-- Stem & Vine (Static) -->
    <g class="pixel stem">
      <rect x="236" y="82" width="12" height="48" />
      <rect x="248" y="82" width="12" height="12" />
      <rect x="260" y="94" width="12" height="12" />
    </g>

    <!-- Main Oval Body - Base Mid Green (Static) -->
    <g class="pixel cuca-mid">
      <rect x="206" y="130" width="72" height="24" />
      <rect x="182" y="154" width="120" height="36" />
      <rect x="170" y="190" width="144" height="108" />
      <rect x="182" y="298" width="120" height="36" />
      <rect x="206" y="334" width="72" height="24" />
    </g>

    <!-- Dark Green Melon Stripes (Static) -->
    <g class="pixel cuca-dark">
      <rect x="194" y="166" width="12" height="156" />
      <rect x="242" y="130" width="12" height="228" />
      <rect x="290" y="166" width="12" height="156" />
      <rect x="182" y="202" width="12" height="84" />
      <rect x="302" y="202" width="12" height="84" />
    </g>

    <!-- Light Green Highlights between stripes (Static) -->
    <g class="pixel cuca-light">
      <rect x="218" y="142" width="12" height="192" />
      <rect x="266" y="142" width="12" height="192" />
      <rect x="206" y="190" width="12" height="120" />
      <rect x="278" y="190" width="12" height="120" />
    </g>

    <!-- Bright Accents (Static) -->
    <g class="pixel cuca-bright">
      <rect x="218" y="190" width="12" height="24" />
      <rect x="218" y="250" width="12" height="36" />
      <rect x="266" y="178" width="12" height="24" />
    </g>

    <!-- ANIMATED OUTER PIXELS: Bi-directional looping flight -->
    <g class="pixel cuca-cyan" filter="url(#cyan-glow)">
      <rect class="fly-pixel" style="--fly-x: -180px; --fly-y: -120px; --delay: 0.1s;" x="110" y="226" width="12" height="12" />
      <rect class="fly-pixel" style="--fly-x: -220px; --fly-y: -40px;  --delay: 0.2s;" x="122" y="250" width="12" height="12" />
      <rect class="fly-pixel" style="--fly-x: -160px; --fly-y: 100px;  --delay: 0.3s;" x="134" y="214" width="12" height="12" />
      <rect class="fly-pixel" style="--fly-x: -200px; --fly-y: 150px;  --delay: 0.4s;" x="134" y="298" width="12" height="12" />
      <rect class="fly-pixel" style="--fly-x: -140px; --fly-y: -200px; --delay: 0.25s;" x="146" y="238" width="12" height="12" />
      <rect class="fly-pixel" style="--fly-x: 220px;  --fly-y: 180px;   --delay: 0.35s;" x="350" y="274" width="12" height="12" />
      <rect class="fly-pixel" style="--fly-x: -250px; --fly-y: 30px;   --delay: 0.15s;" x="158" y="202" width="12" height="12" />
      <rect class="fly-pixel" style="--fly-x: 210px;  --fly-y: -160px;  --delay: 0.45s;" x="330" y="262" width="12" height="12" />
      <rect class="fly-pixel" style="--fly-x: -90px;  --fly-y: -220px; --delay: 0.5s;"  x="170" y="226" width="12" height="12" />
      <rect class="fly-pixel" style="--fly-x: 130px;  --fly-y: 210px;   --delay: 0.55s;" x="310" y="286" width="12" height="12" />
    </g>
  </g>
</svg>
