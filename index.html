<!DOCTYPE html>
<html lang="en">
<head> 
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CreITers // SSHAnet Immanent Transcendence Node 2026</title>
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>

  <!-- NAVIGATION BAR -->
  <nav>
    <a href="#hero" class="nav-brand">
      <svg class="nav-logo" viewBox="0 0 500 550" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <filter id="cyan-glow-nav" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="6" result="blur" />
            <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
          </filter>
        </defs>
        <style>
          .pixel { shape-rendering: crispEdges; }
          .np-main { fill: #22B14C; }
          .np-dark { fill: #156B2E; }
          .np-cyan { fill: #1AFFFF; }
          .np-gold { fill: #D4AF37; }
          .np-stem { fill: #8B5A2B; }
          .np-leaf { fill: #158837; }
        </style>
        <g transform="translate(10, 10)">
          <g class="pixel np-stem"><rect x="230" y="70" width="12" height="60" /></g>
          <g class="pixel np-leaf"><rect x="182" y="94" width="48" height="24" /></g>
          <g class="pixel np-dark"><rect x="254" y="130" width="60" height="200" /></g>
          <g class="pixel np-main"><rect x="182" y="130" width="80" height="200" /></g>
          <g class="pixel np-cyan" filter="url(#cyan-glow-nav)"><rect x="134" y="214" width="36" height="80" /></g>
          <g class="pixel np-gold"><rect x="170" y="250" width="12" height="12" /></g>
        </g>
      </svg>
      <span class="nav-title" id="nav-brand-title">CreITers</span>
    </a>
    <ul class="nav-links" id="nav-links-list"></ul>
  </nav>

  <!-- HERO SECTION -->
  <section id="hero" class="hero">
    <img src="assets/images/creiters_cyberpear.svg" alt="Cyberpear Logo" class="hero-logo">
    <h1 id="hero-title"></h1>
    <div class="hero-subtitle" id="hero-subtitle"></div>
    <p class="hero-desc" id="hero-desc"></p>
    <a href="#terminal" id="hero-cta" class="cta-button"></a>
  </section>

  <!-- MANIFESTO SECTION -->
  <section id="about">
    <h2 class="section-title" id="manifesto-title"></h2>
    <div id="manifesto-body"></div>
    
    <svg class="section-svg-banner" viewBox="0 0 300 220" xmlns="http://www.w3.org/2000/svg">
      <rect width="300" height="220" rx="10" fill="#040909" stroke="#D4AF37" stroke-width="1.5" />
      <g class="cog-spin">
        <circle cx="0" cy="0" r="32" fill="none" stroke="#1AFFFF" stroke-width="3" stroke-dasharray="8,6" />
        <circle cx="0" cy="0" r="14" fill="none" stroke="#1AFFFF" stroke-width="2" />
      </g>
      <g class="cog-reverse">
        <circle cx="0" cy="0" r="24" fill="none" stroke="#D4AF37" stroke-width="3" stroke-dasharray="6,4" />
        <circle cx="0" cy="0" r="8" fill="#D4AF37" />
      </g>
      <path d="M 50 160 Q 110 90 185 125 T 250 50" fill="none" stroke="#ff1a75" stroke-width="2" />
      <text x="150" y="200" font-family="monospace" font-size="11" fill="#1AFFFF" text-anchor="middle">INDUSTRY_5.0 // COGNITIVE_HUMAN_SYNERGY</text>
    </svg>
  </section>

  <!-- ECOSYSTEM SECTION -->
  <section id="ecosystem">
    <h2 class="section-title" id="ecosystem-title"></h2>
    <div class="grid" id="ecosystem-grid"></div>
  </section>

  <!-- BALANCE SECTION -->
  <section id="balance">
    <h2 class="section-title" id="balance-title"></h2>
    <div id="balance-body"></div>
    <svg class="section-svg-banner" viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
      <rect width="300" height="200" rx="10" fill="#050d0d" stroke="#1AFFFF" stroke-width="1" />
      <path d="M 50 100 Q 100 30 150 100 T 250 100" fill="none" stroke="#1AFFFF" stroke-width="2" />
      <path d="M 50 100 Q 100 170 150 100 T 250 100" fill="none" stroke="#ff1a75" stroke-width="2" />
      <circle cx="50" cy="100" r="7" fill="#1AFFFF" />
      <circle cx="100" cy="50" r="6" fill="#D4AF37" />
      <circle cx="150" cy="100" r="9" fill="#ff1a75" />
      <circle cx="200" cy="150" r="6" fill="#D4AF37" />
      <circle cx="250" cy="100" r="7" fill="#1AFFFF" />
      <text x="150" y="180" font-family="monospace" font-size="11" fill="#D4AF37" text-anchor="middle">SYNAPSE_TRANSCENDENCE_v2026</text>
    </svg>
  </section>

  <!-- TERMINAL SECTION -->
  <section id="terminal">
    <h2 class="section-title" id="terminal-title"></h2>
    <div class="terminal-container">
      <div class="terminal-header">
        <span id="term-version"></span>
        <span id="term-status"></span>
      </div>
      <div class="terminal-body" id="term-body">
        <div class="terminal-log"><span style="color: var(--cyan-neon);">SYSTEM:</span> Cyberpear SSHAnet Neural Interface initialized [2026].</div>
        <div class="terminal-log"><span style="color: var(--cyan-neon);">SYSTEM:</span> Type <span style="color: var(--yellow-glow);">'help'</span> for available commands.</div>
      </div>
      <div class="terminal-input-row">
        <span style="color: var(--pink-neon);" id="term-prompt"></span>
        <input type="text" id="term-input" placeholder="Enter command..." autocomplete="off">
      </div>
    </div>
  </section>

  <!-- CONTACT SECTION -->
  <section id="contact">
    <h2 class="section-title" id="contact-title"></h2>
    <div class="card" style="max-width: 600px; margin: 0 auto; width: 100%;">
      <h3 id="contact-card-title"></h3>
      <br>
      <p><strong>NODE:</strong> <span id="contact-node"></span></p>
      <p><strong>OPERATOR:</strong> <span id="contact-operator"></span></p>
      <p><strong>SIGNAL:</strong> <span id="contact-signal"></span></p>
      <br>
      <button class="cta-button" style="width: 100%; text-align: center;" id="contact-btn"></button>
    </div>
  </section>

  <!-- FOOTER -->
  <footer>
    <div class="status-bar">
      <span id="footer-copy"></span>
      <span id="footer-status"></span>
      <span id="footer-transcendence" style="color: var(--gold-transcend);"></span>
      <span id="footer-threat"></span>
    </div>
  </footer>

  <script src="app/main.js"></script>
</body>
</html>
