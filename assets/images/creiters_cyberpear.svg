    <!-- Body - Mid Tone Highlights (Static) -->
    <g class="pixel pear-highlight">
      <rect x="218" y="154" width="12" height="24" />
      <rect x="206" y="178" width="24" height="24" />
      <rect x="194" y="202" width="24" height="36" />
      <rect x="206" y="238" width="24" height="48" />
      <rect x="218" y="286" width="24" height="36" />
    </g>

    <!-- Body - Bright Accents (Static) -->
    <g class="pixel pear-bright">
      <rect x="218" y="202" width="12" height="24" />
      <rect x="218" y="238" width="12" height="36" />
      <rect x="230" y="250" width="12" height="24" />
      <rect x="170" y="190" width="12" height="12" />
      <rect x="158" y="226" width="12" height="12" />
      <rect x="146" y="214" width="12" height="12" />
      <rect x="170" y="250" width="12" height="12" />
      <rect x="158" y="286" width="12" height="12" />
      <rect x="134" y="262" width="12" height="12" />
    </g>

    <!-- Gold Accent Pixels (Static) -->
    <g class="pixel pear-gold">
      <rect x="170" y="250" width="12" height="12" />
      <rect x="158" y="226" width="12" height="12" />
      <rect x="134" y="262" width="12" height="12" />
    </g>

    <!-- ANIMATED OUTER PIXELS ONLY: Flying from outside to build the pear -->
    <g class="pixel pear-cyan" filter="url(#cyan-glow)">
      <rect class="fly-pixel" style="--fly-x: -180px; --fly-y: -120px; --delay: 0.1s;" x="110" y="226" width="12" height="12" />
      <rect class="fly-pixel" style="--fly-x: -220px; --fly-y: -40px;  --delay: 0.2s;" x="122" y="250" width="12" height="12" />
      <rect class="fly-pixel" style="--fly-x: -160px; --fly-y: 100px;  --delay: 0.3s;" x="134" y="214" width="12" height="12" />
      <rect class="fly-pixel" style="--fly-x: -200px; --fly-y: 150px;  --delay: 0.4s;" x="134" y="298" width="12" height="12" />
      <rect class="fly-pixel" style="--fly-x: -140px; --fly-y: -200px; --delay: 0.25s;" x="146" y="238" width="12" height="12" />
      <rect class="fly-pixel" style="--fly-x: -120px; --fly-y: 180px;  --delay: 0.35s;" x="146" y="274" width="12" height="12" />
      <rect class="fly-pixel" style="--fly-x: -250px; --fly-y: 30px;   --delay: 0.15s;" x="158" y="202" width="12" height="12" />
      <rect class="fly-pixel" style="--fly-x: -110px; --fly-y: -160px; --delay: 0.45s;" x="158" y="262" width="12" height="12" />
      <rect class="fly-pixel" style="--fly-x: -90px;  --fly-y: -220px; --delay: 0.5s;"  x="170" y="226" width="12" height="12" />
      <rect class="fly-pixel" style="--fly-x: -130px; --fly-y: 210px;  --delay: 0.55s;" x="170" y="286" width="12" height="12" />
    </g>

    <!-- CYBERPEAR Text (Static) -->
    <text x="240" y="440"
          font-family="monospace"
          font-size="48"
          font-weight="900"
          letter-spacing="8"
          fill="url(#text-grad)"
          text-anchor="middle"
          filter="url(#text-glow)">CYBERPEAR</text>
  </g>
</svg>

